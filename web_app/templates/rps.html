{% extends "base.html" %}
{% block content %}
<h1>Rock Paper Scissors</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('rps_routes.play') }}">
    <label for="user-choice">Your choice</label>
    <select id="user-choice" name="user_choice">
        {% for option in options %}
        <option value="{{ option }}"{% if option == user_choice %} selected{% endif %}>{{ option|capitalize }}</option>
        {% endfor %}
    </select>
    <button type="submit">Play</button>
</form>
{% if winner %}
<section aria-label="Round result" aria-live="polite">
    <h2>{{ winner }}</h2>
    <p>Your choice: {{ user_choice }}</p>
    <p>Computer's choice: {{ computer_choice }}</p>
</section>
{% endif %}
{% endblock %}
