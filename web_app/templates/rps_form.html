{% extends "base.html" %}
{% block title %}Play | Rock Paper Scissors{% endblock %}
{% block content %}
<h1>Rock Paper Scissors</h1>
<p>Choose your move, then click Play to see if you beat the computer.</p>
<form method="post" action="/rps/results">
    <label for="user_choice">Your choice</label>
    <select id="user_choice" name="user_choice">
        {% for option in options %}
        <option value="{{ option }}">{{ option|capitalize }}</option>
        {% endfor %}
    </select>
    <button type="submit">Play</button>
</form>
{% endblock %}
