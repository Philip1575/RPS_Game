{% extends "bootstrap_5_layout.html" %}
{% block title %}Stocks | Philip's Web App{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-2"><i class="bi bi-graph-up-arrow me-2"></i>Stocks Lookup</h1>
                <p class="text-body-secondary mb-4">Enter a stock symbol to see its recent prices.</p>

                <form method="post" action="/stocks/dashboard">
                    <div class="mb-4">
                        <label for="symbol" class="form-label fw-semibold">Stock symbol</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input id="symbol" name="symbol" type="text" class="form-control text-uppercase"
                                placeholder="MSFT" value="MSFT" required>
                        </div>
                        <div class="form-text">For example MSFT, AAPL, GOOGL, or NFLX.</div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-bar-chart-line me-2"></i>View Dashboard
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
